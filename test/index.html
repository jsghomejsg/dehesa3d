<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascota Borde - Art Toy</title>
    <style>
        /* Estilos generales limpios para la prueba */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Estilo base de la imagen de la mascota */
        #mascota-img {
            width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
            transition: transform 0.3s ease;
        }

        .caja-frase {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            min-height: 60px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button, input {
            padding: 10px;
            font-family: monospace;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #3a3a3a;
        }

        /* Clases de animación */
        .animar-inicio { animation: miradaReojo 0.4s ease infinite alternate; }
        .animar-motivacion { animation: negarCabeza 0.4s ease 2; }
        .animar-estado { animation: suspiro 0.8s ease; }
        .animar-trabajo { animation: mirarLados 0.6s ease; }
        .animar-ignorar { animation: encogerHombros 0.5s ease; }

        /* Definición de los movimientos (Keyframes) */
        @keyframes miradaReojo {
            0% { transform: translateX(0); }
            100% { transform: translateX(8px); }
        }
        @keyframes negarCabeza {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-4deg); }
            75% { transform: rotate(4deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes suspiro {
            0% { transform: scale(1, 1); }
            50% { transform: scale(0.96, 1.04); }
            100% { transform: scale(1, 1); }
        }
        @keyframes mirarLados {
            0% { transform: translateX(0) rotate(0deg); }
            30% { transform: translateX(-10px) rotate(-2deg); }
            70% { transform: translateX(10px) rotate(2deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        @keyframes encogerHombros {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px) scale(0.98); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen de la mascota subida -->
        <img id="mascota-img" src="mascota.png" alt="Mascota Art Toy">
        
        <!-- Caja donde aparecen las frases -->
        <div id="caja-mensaje" class="caja-frase">Conectando...</div>

        <!-- Botones de interacción -->
        <div class="botones">
            <button id="btn-inicio">Inicio / Despertar</button>
            <button id="btn-motivacion">Motivación</button>
            <button id="btn-estado">Estado</button>
            <button id="btn-trabajo">Trabajo</button>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="user-text" placeholder="Escríbele algo..." style="flex: 1;">
                <button id="btn-enviar">Ignorar</button>
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="main.js"></script>
</body>
</html>
