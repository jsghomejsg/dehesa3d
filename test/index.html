<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascota Borde - Art Toy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mascota-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: radial-gradient(circle, #f8f9fa 0%, #ffffff 70%);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
        }

        #mascota-img {
            width: 210px;
            height: auto;
            display: block;
            /* Filtro para limpiar el fondo grisáceo de la foto original */
            filter: contrast(110%) brightness(102%);
            mix-blend-mode: multiply;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .caja-frase {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 18px 20px;
            border-radius: 14px;
            width: 100%;
            min-height: 80px;
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.4;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #212529;
            font-weight: 500;
        }

        .botones {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-family: inherit;
            background: #212529;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(33, 37, 41, 0.15);
        }

        button:hover {
            background: #343a40;
        }

        button:active {
            transform: scale(0.98);
        }

        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 14px;
            font-family: inherit;
            background: #f8f9fa;
            color: #212529;
            border: 1px solid #ced4da;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #212529;
            background: #ffffff;
        }

        .input-group button {
            width: 110px;
            box-shadow: none;
        }

        /* Animaciones */
        .animar-inicio { animation: miradaReojo 0.4s ease infinite alternate; }
        .animar-motivacion { animation: negarCabeza 0.4s ease 2; }
        .animar-estado { animation: suspiro 0.8s ease; }
        .animar-trabajo { animation: mirarLados 0.6s ease; }
        .animar-ignorar { animation: encogerHombros 0.5s ease; }

        @keyframes miradaReojo {
            0% { transform: translateX(0); }
            100% { transform: translateX(8px); }
        }
        @keyframes negarCabeza {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes suspiro {
            0% { transform: scale(1, 1); }
            50% { transform: scale(0.94, 1.06); }
            100% { transform: scale(1, 1); }
        }
        @keyframes mirarLados {
            0% { transform: translateX(0) rotate(0deg); }
            30% { transform: translateX(-10px) rotate(-3deg); }
            70% { transform: translateX(10px) rotate(3deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        @keyframes encogerHombros {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px) scale(0.97); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="mascota-wrapper">
            <img id="mascota-img" src="mascota.png" alt="Mascota Art Toy">
        </div>
        
        <div id="caja-mensaje" class="caja-frase">Toca un botón si te atreves, aunque prefiero que no.</div>

        <div class="botones">
            <button id="btn-inicio">Despiértate ya</button>
            <button id="btn-motivacion">Motívame si puedes</button>
            <button id="btn-estado">¿Cómo respiras?</button>
            <button id="btn-trabajo">Habla de currar</button>
            <div class="input-group">
                <input type="text" id="user-text" placeholder="Dile algo absurdo...">
                <button id="btn-enviar">Ignorar</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
