<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascota Borde - Art Toy Oficial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor principal estilo dispositivo / vitrina */
        .app-container {
            background: #111827;
            width: 100%;
            max-width: 420px;
            padding: 35px 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Vitrina circular flotante para el muñeco */
        .mascota-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            background: radial-gradient(circle, #1f2937 0%, #111827 80%);
            border-radius: 50%;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        #mascota-img {
            width: 230px;
            height: auto;
            display: block;
            /* Filtro avanzado para fundir el fondo gris con la oscuridad de la vitrina */
            mix-blend-mode: screen;
            filter: contrast(120%) brightness(110%);
            transform-origin: center bottom;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Bocadillo de texto moderno y elegante */
        .caja-frase {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            min-height: 85px;
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e7eb;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Botones estilizados tipo app de coleccionista */
        .botones {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            font-family: inherit;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 15px;
            font-family: inherit;
            background: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
        }

        input::placeholder {
            color: #6b7280;
        }

        .input-group button {
            width: 110px;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .input-group button:hover {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        /* Animaciones fluidas sobre la vitrina */
        .animar-inicio { animation: miradaReojo 0.4s ease infinite alternate; }
        .animar-motivacion { animation: negarCabeza 0.4s ease 2; }
        .animar-estado { animation: suspiro 0.8s ease; }
        .animar-trabajo { animation: mirarLados 0.6s ease; }
        .animar-ignorar { animation: encogerHombros 0.5s ease; }

        @keyframes miradaReojo {
            0% { transform: translateX(0); }
            100% { transform: translateX(6px); }
        }
        @keyframes negarCabeza {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-4deg); }
            75% { transform: rotate(4deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes suspiro {
            0% { transform: scale(1, 1); }
            50% { transform: scale(0.95, 1.05); }
            100% { transform: scale(1, 1); }
        }
        @keyframes mirarLados {
            0% { transform: translateX(0) rotate(0deg); }
            30% { transform: translateX(-8px) rotate(-2deg); }
            70% { transform: translateX(8px) rotate(2deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        @keyframes encogerHombros {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px) scale(0.97); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="mascota-wrapper">
            <img id="mascota-img" src="mascota.png" alt="Mascota Art Toy">
        </div>
        
        <div id="caja-mensaje" class="caja-frase">Toca un botón si te atreves, aunque prefiero que no.</div>

        <div class="botones">
            <button id="btn-inicio">Despiértate ya</button>
            <button id="btn-motivacion">Motívame si puedes</button>
            <button id="btn-estado">¿Cómo respiras?</button>
            <button id="btn-trabajo">Habla de currar</button>
            <div class="input-group">
                <input type="text" id="user-text" placeholder="Dile algo absurdo...">
                <button id="btn-enviar">Ignorar</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
