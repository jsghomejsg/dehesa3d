<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascota Borde</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #avatar-container {
            width: 250px;
            height: 250px;
            background-color: #222;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #avatar-placeholder {
            font-size: 60px;
            font-weight: bold;
            color: #555;
            letter-spacing: -3px;
        }

        #message-box {
            font-size: 20px;
            min-height: 80px;
            max-width: 350px;
            line-height: 1.4;
            color: #e0e0e0;
            margin-bottom: 30px;
        }

        /* Nueva zona interactiva */
        #interact-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #777;
        }

        button { 
            background-color: #ffffff; 
            color: #000000; 
            padding: 12px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer; 
            font-weight: bold; 
            font-family: inherit;
        }

        button:hover { background-color: #dddddd; }
        
        /* Botones secundarios más discretos */
        .btn-secundario {
            background-color: #333;
            color: #fff;
        }
        .btn-secundario:hover { background-color: #444; }

    </style>
</head>
<body>

    <div id="avatar-container">
        <span id="avatar-placeholder">¬_¬</span>
    </div>

    <div id="message-box">Cargando actitud...</div>

    <!-- Panel de interacción del usuario -->
    <div id="interact-panel">
        <div class="button-row">
            <button class="btn-secundario" onclick="responder('motivacion')">Motívame</button>
            <button class="btn-secundario" onclick="responder('estado')">¿Qué tal?</button>
            <button class="btn-secundario" onclick="responder('trabajo')">A trabajar</button>
        </div>
        <div class="input-row">
            <input type="text" id="user-text" placeholder="Dime algo...">
            <button onclick="ignorarTexto()">Enviar</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
