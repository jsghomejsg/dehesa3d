<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascota Borde - Art Toy</title>
    <style>
        body {
            background-color: #ffffff;
            color: #222222;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        /* Muñeco grande y protagonista con fusión de fondo blanca */
        #mascota-img {
            width: 280px;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
            mix-blend-mode: multiply; /* Elimina el fondo de la foto automáticamente */
            transition: transform 0.3s ease;
        }

        .caja-frase {
            background: #f9f9f9;
            border: 1px solid #dcdcdc;
            padding: 18px;
            border-radius: 8px;
            min-height: 70px;
            margin-bottom: 20px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button, input {
            padding: 14px;
            font-family: monospace;
            background: #f1f1f1;
            color: #111;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:hover {
            background: #e2e2e2;
        }

        input {
            background: #fff;
            text-align: left;
        }

        /* Clases de animación */
        .animar-inicio { animation: miradaReojo 0.4s ease infinite alternate; }
        .animar-motivacion { animation: negarCabeza 0.4s ease 2; }
        .animar-estado { animation: suspiro 0.8s ease; }
        .animar-trabajo { animation: mirarLados 0.6s ease; }
        .animar-ignorar { animation: encogerHombros 0.5s ease; }

        /* Keyframes de animación */
        @keyframes miradaReojo {
            0% { transform: translateX(0); }
            100% { transform: translateX(10px); }
        }
        @keyframes negarCabeza {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes suspiro {
            0% { transform: scale(1, 1); }
            50% { transform: scale(0.95, 1.05); }
            100% { transform: scale(1, 1); }
        }
        @keyframes mirarLados {
            0% { transform: translateX(0) rotate(0deg); }
            30% { transform: translateX(-12px) rotate(-3deg); }
            70% { transform: translateX(12px) rotate(3deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        @keyframes encogerHombros {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px) scale(0.97); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen principal grande -->
        <img id="mascota-img" src="mascota.png" alt="Mascota Art Toy">
        
        <!-- Caja de frases -->
        <div id="caja-mensaje" class="caja-frase">...</div>

        <!-- Botones -->
        <div class="botones">
            <button id="btn-inicio">Inicio / Despertar</button>
            <button id="btn-motivacion">Motivación</button>
            <button id="btn-estado">Estado</button>
            <button id="btn-trabajo">Trabajo</button>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="user-text" placeholder="Escríbele algo..." style="flex: 1;">
                <button id="btn-enviar">Ignorar</button>
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="main.js"></script>
</body>
</html>
